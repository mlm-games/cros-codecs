[package]
name = "nuxodecs"
version = "0.1.0"
license = "BSD-3-Clause"
description = "Hardware-accelerated codecs for Linux"
repository = "https://github.com/mlm-games/cros-codecs"
authors = ["mlm-games"] # Original: ["The ChromiumOS Authors"]
edition = "2024"
rust-version = "1.88"
keywords = ["vaapi", "v4l2", "video", "hardware", "codecs", "drm"]
categories = ["multimedia", "api-bindings"]
homepage = "https://github.com/mlm-games/cros-codecs"
readme = "README.md"

[features]
default = []
backend = [
    "anyhow",
    "byteorder",
    "thiserror",
    "crc32fast",
    "nix",
    "drm",
    "drm-fourcc",
    "zerocopy",
]
vaapi = ["libva", "backend"]
vaapi_dlopen = ["vaapi", "libva/vendored"]
v4l2 = ["v4l2r", "backend"]
gbm = ["dep:gbm", "gbm-sys"]
h265 = []
av1 = []
c2-wrapper = ["backend"]
fuzzing = []

[dependencies]
anyhow = { version = "1.0.75", optional = true }
byteorder = { version = "1.4.3", optional = true }
libva = { version = "0.1", optional = true }
v4l2r = { version = "0.0.8", package = "v4l2r", optional = true }
log = { version = "0", features = ["release_max_level_debug"] }
thiserror = { version = "2", optional = true }
crc32fast = { version = "1.3.2", optional = true }
nix = { version = "0.31", features = [
    "fs",
    "event",
    "poll",
    "mman",
    "ioctl",
], optional = true }
drm = { version = "0.15", optional = true }
drm-fourcc = { version = "2.2.0", optional = true }
gbm = { version = "0.18", default-features = false, features = [
    "drm-support",
], optional = true }
gbm-sys = { version = "0.4", optional = true }
zerocopy = { version = "0.8", optional = true, features = ["derive"] }

[dev-dependencies]
argh = "0.1.12"
env_logger = "0.11"
serde_json = "1.0.96"

[lints.rust]
# Required to allow #[cfg(fuzzing)]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[[example]]
name = "ccdec"
required-features = ["backend"]

[[example]]
name = "ccenc"
required-features = ["backend"]

[[example]]
name = "perf_test"
required-features = ["backend"]
